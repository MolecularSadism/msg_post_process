# CI for msg_post_process as a standalone repository.
#
# Inert inside the Gravitaria monorepo (workflows only run from the repo
# root, and there the parent workspace's CI covers this crate); it becomes
# active as-is when this folder is published as its own repo. Runs on
# stable — no nightly features are used.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Docs
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # Plain `cargo test` so the crate-level doc test runs too.
      - name: Tests
        run: cargo test
